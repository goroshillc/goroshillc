<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 52" role="img" aria-labelledby="title desc">
  <title id="title">Goroshi engineering focus</title>
  <desc id="desc">Three locally hosted badges: Rust-first, source to observed result, and fully remote.</desc>
  <rect width="900" height="52" fill="#000000"/>
  <g fill="none" stroke="#E11D35" stroke-width="2">
    <rect x="2" y="2" width="214" height="48"/>
    <rect x="230" y="2" width="442" height="48"/>
    <rect x="686" y="2" width="212" height="48"/>
  </g>
  <g fill="#F02A43" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="2">
    <text x="109" y="32">RUST-FIRST</text>
    <text x="451" y="32">SOURCE · TEST · OBSERVE</text>
    <text x="792" y="32">REMOTE</text>
  </g>
</svg>
